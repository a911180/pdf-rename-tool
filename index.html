<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 分頁＋批次重新命名工具</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    background: #f5f7fa;
    color: #222;
}

.container {
    max-width: 1500px;
    margin: 0 auto;
    padding: 25px;
}

h1 {
    margin-top: 0;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 20px;
}

.panel {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.panel-title h2 {
    margin: 0;
    font-size: 20px;
}

.status {
    font-size: 14px;
    color: #666;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fafafa;
}

.file-info {
    margin-top: 10px;
    padding: 10px;
    background: #f1f3f5;
    border-radius: 8px;
    font-size: 14px;
    word-break: break-all;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    background: #1976d2;
    color: white;
}

button:hover {
    background: #125ca8;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.clear-btn {
    background: #777;
}

.clear-btn:hover {
    background: #555;
}

.result {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #f5f5f5;
    white-space: pre-wrap;
}

.success {
    color: #16803c;
}

.error {
    color: #c62828;
}

.preview-scroll {
    height: 500px;
    overflow-y: auto;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-top: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 9px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    position: sticky;
    top: 0;
    background: #f1f3f5;
    z-index: 1;
}

.progress-container {
    margin-top: 15px;
    display: none;
}

.progress-bar-bg {
    width: 100%;
    height: 18px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #1976d2;
    transition: width 0.2s;
}

.progress-text {
    margin-top: 8px;
    text-align: center;
    font-size: 14px;
}

.download-btn {
    display: none;
    background: #16803c;
}

.download-btn:hover {
    background: #10632e;
}

.warning {
    padding: 10px;
    border-radius: 8px;
    background: #fff3cd;
    color: #856404;
    margin-top: 10px;
}

@media (max-width: 1000px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .preview-scroll {
        height: 400px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>📄 PDF 分頁＋批次重新命名工具</h1>

    <div class="subtitle">
        PDF 與 TXT 都在你的瀏覽器本機處理，不會上傳到伺服器
    </div>

    <div class="grid">

        <!-- 左側 -->
        <div class="panel">

            <div class="panel-title">
                <h2>📂 ① 上傳 PDF</h2>
                <span id="pdfStatus" class="status">⚪ 等待</span>
            </div>

            <input
                type="file"
                id="pdfInput"
                accept=".pdf,application/pdf"
            >

            <div id="pdfInfo" class="file-info">
                尚未選擇 PDF
            </div>

            <br>

            <div class="panel-title">
                <h2>📝 ② 上傳 TXT</h2>
                <span id="txtStatus" class="status">⚪ 等待</span>
            </div>

            <input
                type="file"
                id="txtInput"
                accept=".txt,text/plain"
            >

            <div id="txtInfo" class="file-info">
                尚未選擇 TXT
            </div>

        </div>


        <!-- 中間 -->
        <div class="panel">

            <div class="panel-title">
                <h2>🔍 ③ 檢查與預覽</h2>
                <span id="checkStatus" class="status">⚪ 等待</span>
            </div>

            <button id="checkBtn">
                🔍 檢查 PDF 與 TXT
            </button>

            <div id="checkResult" class="result">
                尚未檢查。
            </div>

            <div class="preview-scroll">

                <table>

                    <thead>
                        <tr>
                            <th>頁碼</th>
                            <th>原檔</th>
                            <th>重新命名</th>
                        </tr>
                    </thead>

                    <tbody id="previewBody">
                    </tbody>

                </table>

            </div>

        </div>


        <!-- 右側 -->
        <div class="panel">

            <div class="panel-title">
                <h2>📦 ④ 執行</h2>
                <span id="processStatus" class="status">⚪ 等待</span>
            </div>

            <button id="processBtn" disabled>
                ▶️ 開始分頁與重新命名
            </button>

            <div class="progress-container" id="progressContainer">

                <div class="progress-bar-bg">
                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>
                </div>

                <div
                    class="progress-text"
                    id="progressText">
                    準備中...
                </div>

            </div>

            <div id="processResult" class="result">
                尚未執行。
            </div>

            <button
                id="downloadBtn"
                class="download-btn">
                📥 下載 ZIP
            </button>

            <button
                id="clearBtn"
                class="clear-btn">
                🗑️ 全部清除
            </button>

        </div>

    </div>

</div>


<script>

let pdfFile = null;
let txtFile = null;
let names = [];
let checked = false;
let finalZipBlob = null;
let finalZipName = "PDF_重新命名結果.zip";


/* =========================
   PDF 上傳
========================= */

document.getElementById("pdfInput").addEventListener("change", function() {

    pdfFile = this.files[0];

    if (!pdfFile) {
        return;
    }

    document.getElementById("pdfStatus").textContent =
        "🟢 上傳完成";

    document.getElementById("pdfInfo").textContent =
        `${pdfFile.name} · ${formatBytes(pdfFile.size)}`;

    checked = false;

    document.getElementById("processBtn").disabled = true;

});


/* =========================
   TXT 上傳
========================= */

document.getElementById("txtInput").addEventListener("change", async function() {

    txtFile = this.files[0];

    if (!txtFile) {
        return;
    }

    document.getElementById("txtStatus").textContent =
        "🟢 上傳完成";

    document.getElementById("txtInfo").textContent =
        `${txtFile.name} · ${formatBytes(txtFile.size)}`;

    checked = false;

    document.getElementById("processBtn").disabled = true;

});


/* =========================
   檢查
========================= */

document.getElementById("checkBtn").addEventListener("click", async function() {

    if (!pdfFile || !txtFile) {

        showCheckError("請先上傳 PDF 與 TXT。");

        return;
    }

    document.getElementById("checkStatus").textContent =
        "🔵 檢查中...";

    document.getElementById("checkResult").textContent =
        "正在讀取 PDF 與 TXT...";

    document.getElementById("previewBody").innerHTML = "";

    try {

        /* 讀 TXT */

        const text = await txtFile.text();

        names = [];

        text.split(/\r?\n/).forEach(rawLine => {

            let line = rawLine.trim();

            if (!line) {
                return;
            }

            /*
             支援：
             1. 名稱
             2. 名稱
             3、名稱
             4) 名稱
            */

            line = line.replace(
                /^\s*\d+\s*[.)、．]\s*/,
                ""
            );

            line = cleanFilename(line);

            if (line) {
                names.push(line);
            }

        });


        /* 讀 PDF */

        const pdfBytes = await pdfFile.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(pdfBytes);

        const pageCount =
            pdfDoc.getPageCount();


        /* 頁數檢查 */

        if (pageCount !== names.length) {

            showCheckError(
                `❌ PDF 頁數與 TXT 名稱數量不同。\n\n` +
                `PDF：${pageCount} 頁\n` +
                `TXT：${names.length} 個名稱`
            );

            return;
        }


        /* 建立最終檔名 */

        const finalNames = names.map(name => {

            if (
                name.toLowerCase().endsWith(".pdf")
            ) {
                return name;
            }

            return name + ".pdf";

        });


        /* 檢查重複 */

        const seen = new Set();
        const duplicates = [];

        finalNames.forEach(name => {

            const key = name.toLowerCase();

            if (seen.has(key)) {

                if (!duplicates.includes(name)) {
                    duplicates.push(name);
                }

            } else {

                seen.add(key);

            }

        });


        if (duplicates.length > 0) {

            showCheckError(
                "❌ 發現重複檔名：\n\n" +
                duplicates.join("\n")
            );

            return;
        }


        /* 顯示預覽 */

        const body =
            document.getElementById("previewBody");

        finalNames.forEach((name, index) => {

            const tr =
                document.createElement("tr");

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>第 ${index + 1} 頁</td>
                <td>${escapeHtml(name)}</td>
            `;

            body.appendChild(tr);

        });


        document.getElementById("checkStatus").textContent =
            "🟢 檢查完成";

        document.getElementById("checkResult").innerHTML =
            `<span class="success">
            ✅ 檢查完成<br><br>
            PDF：${pageCount} 頁<br>
            TXT：${names.length} 個名稱<br>
            檔名重複：無
            </span>`;

        checked = true;

        document.getElementById("processBtn").disabled =
            false;

    } catch (error) {

        console.error(error);

        showCheckError(
            "❌ 檢查失敗：\n" +
            error.message
        );

    }

});


/* =========================
   執行 PDF 分頁
========================= */

document.getElementById("processBtn").addEventListener("click", async function() {

    if (!checked || !pdfFile || !txtFile) {
        return;
    }

    const processBtn =
        document.getElementById("processBtn");

    processBtn.disabled = true;

    document.getElementById("processStatus").textContent =
        "🔵 處理中...";

    document.getElementById("processResult").textContent =
        "正在準備 PDF...";

    document.getElementById("downloadBtn").style.display =
        "none";

    document.getElementById("progressContainer").style.display =
        "block";

    try {

        const pdfBytes =
            await pdfFile.arrayBuffer();

        const sourcePdf =
            await PDFLib.PDFDocument.load(pdfBytes);

        const pageCount =
            sourcePdf.getPageCount();

        const zip =
            new JSZip();


        /* 每頁建立一個 PDF */

        for (let i = 0; i < pageCount; i++) {

            const newPdf =
                await PDFLib.PDFDocument.create();

            const [page] =
                await newPdf.copyPages(
                    sourcePdf,
                    [i]
                );

            newPdf.addPage(page);

            const outputBytes =
                await newPdf.save();

            const filename =
                names[i].toLowerCase().endsWith(".pdf")
                ? names[i]
                : names[i] + ".pdf";


            zip.file(
                filename,
                outputBytes
            );


            const percent =
                Math.round(
                    ((i + 1) / pageCount) * 100
                );

            document.getElementById("progressBar").style.width =
                percent + "%";

            document.getElementById("progressText").textContent =
                `正在處理第 ${i + 1} / ${pageCount} 頁`;

            /*
             讓瀏覽器有機會更新畫面
            */

            await new Promise(resolve =>
                setTimeout(resolve, 0)
            );

        }


        /* 建立 ZIP */

        document.getElementById("progressText").textContent =
            "正在建立 ZIP...";

        document.getElementById("progressBar").style.width =
            "100%";


        finalZipBlob =
            await zip.generateAsync({
                type: "blob",
                compression: "STORE"
            });


        finalZipName =
            "PDF_重新命名結果.zip";


        document.getElementById("processStatus").textContent =
            "🟢 處理完成";

        document.getElementById("processResult").innerHTML =
            `<span class="success">
            ✅ 處理完成<br><br>
            共產生 ${pageCount} 個 PDF<br>
            ZIP 大小：${formatBytes(finalZipBlob.size)}
            </span>`;


        document.getElementById("downloadBtn").style.display =
            "block";


        document.getElementById("progressText").textContent =
            "100% · ZIP 已建立";


    } catch (error) {

        console.error(error);

        document.getElementById("processStatus").textContent =
            "🔴 失敗";

        document.getElementById("processResult").innerHTML =
            `<span class="error">
            ❌ 處理失敗：<br>
            ${escapeHtml(error.message)}
            </span>`;

    } finally {

        processBtn.disabled = false;

    }

});


/* =========================
   ZIP 下載
========================= */

document.getElementById("downloadBtn").addEventListener("click", function() {

    if (!finalZipBlob) {
        return;
    }

    const url =
        URL.createObjectURL(finalZipBlob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        finalZipName;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 10000);

});


/* =========================
   全部清除
========================= */

document.getElementById("clearBtn").addEventListener("click", function() {

    pdfFile = null;
    txtFile = null;
    names = [];
    checked = false;
    finalZipBlob = null;

    document.getElementById("pdfInput").value = "";
    document.getElementById("txtInput").value = "";

    document.getElementById("pdfStatus").textContent =
        "⚪ 等待";

    document.getElementById("txtStatus").textContent =
        "⚪ 等待";

    document.getElementById("checkStatus").textContent =
        "⚪ 等待";

    document.getElementById("processStatus").textContent =
        "⚪ 等待";

    document.getElementById("pdfInfo").textContent =
        "尚未選擇 PDF";

    document.getElementById("txtInfo").textContent =
        "尚未選擇 TXT";

    document.getElementById("checkResult").textContent =
        "尚未檢查。";

    document.getElementById("processResult").textContent =
        "尚未執行。";

    document.getElementById("previewBody").innerHTML =
        "";

    document.getElementById("processBtn").disabled =
        true;

    document.getElementById("downloadBtn").style.display =
        "none";

    document.getElementById("progressContainer").style.display =
        "none";

    document.getElementById("progressBar").style.width =
        "0%";

});


/* =========================
   工具函式
========================= */

function cleanFilename(name) {

    return name
        .replace(/[<>:"/\\|?*]/g, "_")
        .trim()
        .replace(/[. ]+$/, "");

}


function formatBytes(bytes) {

    if (bytes === 0) {
        return "0 B";
    }

    const units =
        ["B", "KB", "MB", "GB"];

    const i =
        Math.floor(
            Math.log(bytes) / Math.log(1024)
        );

    return (
        (bytes / Math.pow(1024, i))
        .toFixed(2)
        + " "
        + units[i]
    );

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


function showCheckError(message) {

    document.getElementById("checkStatus").textContent =
        "🔴 檢查失敗";

    document.getElementById("checkResult").innerHTML =
        `<span class="error">
        ${escapeHtml(message)}
        </span>`;

    document.getElementById("processBtn").disabled =
        true;

}

</script>

</body>
</html>
